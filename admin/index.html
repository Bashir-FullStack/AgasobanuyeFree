<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/c4/e5/28/c4e5282b9c9c3f188fcf3df08ae6f1c6.jpg" />
    <title>Hiromart — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-page: #F2F7FB;
        --bg-card: #ffffff;
        --bg-input: #ECF0F4;
        --bg-sidebar: #ffffff;
        --text-primary: #111111;
        --text-secondary: #575864;
        --text-muted: #95989D;
        --border-color: #ECF0F4;
        --border-light: #F2F7FB;
        --shadow: 0px 4px 24px 2px rgba(20,25,38,0.05);
      }
      .dark {
        --bg-page: #0F172A;
        --bg-card: #1E293B;
        --bg-input: #334155;
        --bg-sidebar: #1E293B;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        --border-color: #334155;
        --border-light: #1E293B;
        --shadow: 0px 4px 24px 2px rgba(0,0,0,0.3);
      }
      body {
        transition: background-color 0.3s, color 0.3s;
      }
    </style>
  </head>
  <body class="bg-[#F2F7FB] font-sans antialiased" style="background-color: var(--bg-page);">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
